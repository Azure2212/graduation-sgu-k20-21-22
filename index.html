<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="logoSGU.png" type="image/png" />
  <title>🎓Chúc Mừng Tốt Nghiệp SGUers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background-image: url('graduation_background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      text-align: center;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 70%;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      padding: 20px;
      box-sizing: border-box;
      z-index: 10;
      cursor: not-allowed;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .video-container {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="video-container">
    <iframe
      id="videoFrame"
      src=""
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>

    <div class="overlay" id="overlay">
      🎓 Video này sẽ được mở sau ngày <strong>01/08/2025</strong>. Vui lòng quay lại sau nhé!
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const k = urlParams.get('k');
    const iframe = document.getElementById('videoFrame');
    const overlay = document.getElementById('overlay');

    let releaseDate;

    if (k === '20') {
      iframe.src = "https://www.youtube.com/embed/0PXLyGYPz1U";
      overlay.innerHTML = '🎓 Video này sẽ được mở sau ngày&nbsp;<strong>01/08/2025</strong>. Vui lòng quay lại sau nhé!';
      releaseDate = new Date('2025-08-01T00:00:00');
    } else if (k === 'CH') {
      iframe.src = "https://www.youtube.com/embed/AiD1a2fFFLw?start=12&autoplay=1&modestbranding=1&rel=0";
      overlay.innerHTML = '🎓 Video này sẽ được mở sau ngày&nbsp;<strong>01/09/2025</strong>. Vui lòng quay lại sau nhé!';
      releaseDate = new Date('2025-09-01T00:00:00');
    } else if (k === '21') {
      iframe.src = "https://www.youtube.com/embed/AiD1a2fFFLw?start=12&autoplay=1&modestbranding=1&rel=0";
      overlay.innerHTML = '🎓 Video này sẽ được mở sau ngày&nbsp;<strong>01/03/2026</strong>. Vui lòng quay lại sau nhé!';
      releaseDate = new Date('2026-03-01T00:00:00');
    } else {
      iframe.src = "https://www.youtube.com/embed/0PXLyGYPz1U";
      overlay.innerHTML = '🎓 Video này sẽ được mở sau ngày&nbsp;<strong>01/03/2027</strong>. Vui lòng quay lại sau nhé!';
      releaseDate = new Date('2027-03-01T00:00:00');
    }

    const now = new Date();
    if (now >= releaseDate) {
      overlay.classList.add('hidden');
    }
  </script>
</body>
</html>
